<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Agrícola</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Botón superior para abrir/cerrar el menú -->
  <header class="top-bar">
    <button id="menu-toggle" class="btn-menu" onclick="toggleMenu()">
      <span class="icon-hamburger">☰</span> MENÚ
    </button>
  </header>

  <div class="main-container">
    <!-- Menú Lateral Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        GESTIÓN AGRÍCOLA
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="seleccionarOpcion(this, 'laboreos')">
          <span class="nav-icon">🚜</span> LABOREOS
        </button>
        <button class="nav-item" onclick="seleccionarOpcion(this, 'poda')">
          <span class="nav-icon">✂️</span> PODA
        </button>
        <button class="nav-item" onclick="seleccionarOpcion(this, 'tratamientos')">
          <span class="nav-icon">🧪</span> TRATAMIENTOS
        </button>
        <button class="nav-item" onclick="seleccionarOpcion(this, 'recoleccion')">
          <span class="nav-icon">🧺</span> RECOLECCIÓN
        </button>
      </nav>
    </aside>

    <!-- Áreas de contenido -->
    <main class="content">
      <section id="sec-laboreos" class="content-section active">
        <h2>Sección: Laboreos</h2>
        <p>Aquí se cargará el formulario o los datos de Laboreos desde Google Sheets.</p>
      </section>

      <section id="sec-poda" class="content-section">
        <h2>Sección: Poda</h2>
        <p>Aquí se cargarán los datos de Poda.</p>
      </section>

      <section id="sec-tratamientos" class="content-section">
        <h2>Sección: Tratamientos</h2>
        <p>Aquí se cargarán los datos de Tratamientos.</p>
      </section>

      <section id="sec-recoleccion" class="content-section">
        <h2>Sección: Recolección</h2>
        <p>Aquí se cargarán los datos de Recolección.</p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
