<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Parcelas</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
        }
        body { 
            background-color: #f8f9fa; 
            color: #3c4043; 
            margin: 0; 
            padding: 8px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background-color: #ffffff; 
            border: 1px solid #dadce0; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 1350px; 
            padding: 10px; 
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.15); 
            overflow: hidden;
        }
        h2 { 
            margin-top: 0; 
            color: #1a73e8; 
            font-size: 18px; 
            border-bottom: 2px solid #e8eaed; 
            padding-bottom: 8px; 
            text-align: center;
        }
        
        .status-bar { 
            background: #e8f0fe; 
            color: #1a73e8; 
            padding: 8px; 
            border-radius: 6px; 
            font-size: 12px; 
            margin-bottom: 10px; 
            display: none; 
            font-weight: 500; 
            text-align: center;
        }

        .table-responsive { 
            width: 100%; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }
        table { 
            width: 100%; 
            min-width: 700px; 
            border-collapse: collapse; 
            table-layout: fixed; 
        }
        
        th, td { 
            border: 1px solid #dadce0; 
            vertical-align: middle; 
            text-align: center; 
            font-size: 12px; 
            padding: 6px 2px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            word-break: break-word; 
        }
        th { 
            background-color: #f1f3f4; 
            color: #5f6368; 
            font-weight: 600; 
        }
        tr:nth-child(even) { background-color: #f8f9fa; }
        
        /* ANCHOS DE LAS COLUMNAS */
        .w-pol { width: 8%; }
        .w-num { width: 9%; font-weight: bold; }
        .w-hecho { width: 14%; }
        .w-fecha-d { width: 22%; }
        .w-trat { width: 10%; }
        .w-fecha-f { width: 15%; }
        .w-nombre { width: 22%; }

        .flex-checks { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 4px; 
            width: 100%;
        }
        
        input[type="checkbox"] { 
            width: 18px;
            height: 18px;
            cursor: pointer; 
            accent-color: #1a73e8; 
            margin: 0;
        }
        
        .col-fecha-d, .col-fecha-f { 
            color: #3c4043; 
            font-family: monospace; 
            font-size: 11px; 
            line-height: 1.2;
            word-wrap: break-word;
            white-space: normal;
        }
        
        .input-nombre { 
            width: 100%; 
            min-height: 32px; 
            padding: 4px; 
            border: transparent; 
            border-radius: 4px; 
            outline: none; 
            resize: none; 
            font-size: 11px;
            background-color: transparent; 
            color: #3c4043; 
            cursor: not-allowed; 
            text-align: center;
            word-break: break-word;
        }

        @media (max-width: 600px) {
            body { padding: 4px; }
            .container { padding: 6px; }
            th, td { font-size: 11px; padding: 4px 1px; }
            input[type="checkbox"] { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Parcelas</h2>
    <div id="status" class="status-bar">Sincronizando con Google Sheets...</div>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="w-pol">Nº Pol.</th>
                    <th class="w-num">Nº Parc.</th>
                    <th class="w-hecho">Hecho</th>
                    <th class="w-fecha-d">Fecha Registro</th>
                    <th class="w-trat">Trat.</th>
                    <th class="w-fecha-f">Fecha Trat.</th>
                    <th class="w-nombre">Nombre Parcela</th>
                </tr>
            </thead>
            <tbody id="tabla-parcelas">
                <tr><td colspan="7" style="text-align:center; padding:20px; color:#5f6368;">Cargando datos...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // URL DE LA API DE GOOGLE APPS SCRIPT ACTUALIZADA
    const URL_API = 'https://script.google.com/macros/s/AKfycbycuDsb51R_YByTMRH0m_wzjiAP_3c1Iz_8k4BH28EPcx6TiFl68OgR2-GxE4o6N6RY/exec'; 

    window.onload = function() {
        cargarDatosDesdeNube();
    };

    function cargarDatosDesdeNube() {
        mostrarEstado("Sincronizando con Google Sheets...");
        fetch(URL_API)
        .then(res => res.json())
        .then(lista => {
            const tbody = document.getElementById('tabla-parcelas');
            tbody.innerHTML = '';

            if(!lista || lista.length === 0) { 
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px;">La hoja está vacía.</td></tr>`;
                return; 
            }
            
            lista.forEach((p, index) => {
                let fechaDFormateada = normalizarFechaTexto(p.fechaD);
                let fechaFFormateada = normalizarFechaTexto(p.fechaF);

                const tr = document.createElement('tr');
                tr.id = `fila-${index}`;
                tr.innerHTML = `
                    <!-- COLUMNAS SOLO LECTURA -->
                    <td class="col-poligono">${p.poligono}</td>
                    <td class="col-parcela">${p.id}</td>
                    
                    <!-- HECHO (EDITABLE) -->
                    <td>
                        <div class="flex-checks">
                            <input type="checkbox" class="chk-c1" ${p.c1 ? 'checked' : ''} onchange="calcularFechasColumnaD(${index})">
                            <input type="checkbox" class="chk-c2" ${p.c2 ? 'checked' : ''} onchange="calcularFechasColumnaD(${index})">
                            <input type="checkbox" class="chk-c3" ${p.c3 ? 'checked' : ''} onchange="calcularFechasColumnaD(${index})">
                        </div>
                    </td>
                    
                    <!-- FECHA DE REGISTRO HECHO (D) -->
                    <td class="col-fecha-d" id="fechaD-${index}">${fechaDFormateada}</td>
                    
                    <!-- TRATAMIENTO (E) (EDITABLE) -->
                    <td>
                        <input type="checkbox" class="chk-tratamiento" ${p.tratamientoCheck ? 'checked' : ''} onchange="cambiarFechaTratamiento(${index})">
                    </td>
                    
                    <!-- FECHA DE REGISTRO TRATAMIENTO (F) -->
                    <td class="col-fecha-f" id="fechaF-${index}">${fechaFFormateada}</td>
                    
                    <!-- NOMBRE PARCELA (SOLO LECTURA) -->
                    <td>
                        <textarea class="input-nombre" readonly>${p.nombre}</textarea>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            mostrarEstado("Datos cargados correctamente ✔️");
        })
        .catch(() => mostrarEstado("❌ No se pudo conectar con Google Sheets"));
    }

    function normalizarFechaTexto(textoFecha) {
        if (!textoFecha || textoFecha === "FALSE") return "";
        
        if (textoFecha.includes(',')) {
            return textoFecha.split(',').map(f => normalizarFechaTexto(f.trim())).join(', ');
        }

        const d = new Date(textoFecha);
        if (!isNaN(d.getTime())) {
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const anio = d.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }

        return textoFecha;
    }

    function calcularFechasColumnaD(index) {
        const c1 = document.querySelector(`#fila-${index} .chk-c1`).checked;
        const c2 = document.querySelector(`#fila-${index} .chk-c2`).checked;
        const c3 = document.querySelector(`#fila-${index} .chk-c3`).checked;
        const celdaD = document.getElementById(`fechaD-${index}`);

        const ahora = new Date();
        const dia = String(ahora.getDate()).padStart(2, '0');
        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
        const anio = ahora.getFullYear();
        const fechaHoy = `${dia}/${mes}/${anio}`;

        let fechasArray = [];
        if (c1) fechasArray.push(fechaHoy);
        if (c2) fechasArray.push(fechaHoy);
        if (c3) fechasArray.push(fechaHoy);

        celdaD.textContent = fechasArray.length > 0 ? fechasArray.join(", ") : "";

        enviarDatosANube();
    }

    function cambiarFechaTratamiento(index) {
        const checkTrat = document.querySelector(`#fila-${index} .chk-tratamiento`);
        const celdaF = document.getElementById(`fechaF-${index}`);

        if (checkTrat.checked) {
            const ahora = new Date();
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const anio = ahora.getFullYear();
            
            celdaF.textContent = `${dia}/${mes}/${anio}`;
        } else {
            celdaF.textContent = "";
        }

        enviarDatosANube();
    }

    function enviarDatosANube() {
        mostrarEstado("Guardando en Google Sheets...");
        const datos = [];
        
        const filas = document.querySelectorAll('#tabla-parcelas tr');
        
        filas.forEach((tr, index) => {
            const celdas = tr.querySelectorAll('td');
            if (celdas.length >= 7) {
                datos.push({
                    poligono: celdas[0].textContent.trim(),
                    id: celdas[1].textContent.trim(),
                    c1: tr.querySelector('.chk-c1') ? tr.querySelector('.chk-c1').checked : false,
                    c2: tr.querySelector('.chk-c2') ? tr.querySelector('.chk-c2').checked : false,
                    c3: tr.querySelector('.chk-c3') ? tr.querySelector('.chk-c3').checked : false,
                    fechaD: document.getElementById(`fechaD-${index}`) ? document.getElementById(`fechaD-${index}`).textContent : "",
                    tratamientoCheck: tr.querySelector('.chk-tratamiento') ? tr.querySelector('.chk-tratamiento').checked : false,
                    fechaF: document.getElementById(`fechaF-${index}`) ? document.getElementById(`fechaF-${index}`).textContent : "",
                    nombre: tr.querySelector('.input-nombre') ? tr.querySelector('.input-nombre').value : ""
                });
            }
        });

        fetch(URL_API, { 
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos) 
        })
        .then(() => mostrarEstado("Datos guardados en la nube ✔️"))
        .catch(() => mostrarEstado("❌ Error al guardar"));
    }

    function mostrarEstado(msg) {
        const div = document.getElementById("status");
        div.style.display = "block";
        div.textContent = msg;
    }
</script>
</body>
</html>
