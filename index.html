<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestión Agrícola</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1e28;
      color: #333333;
      padding-bottom: 30px;
      min-height: 100vh;
    }

    /* CABECERA */
    .header {
      padding: 20px 20px 10px 20px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
    }

    .btn-principal {
      width: 100%;
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-principal:active {
      transform: scale(0.98);
      background-color: #059669;
    }

    /* CONTENEDOR PRINCIPAL */
    .main-content {
      padding: 15px 20px;
    }

    .section-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    /* TARJETAS DE INICIO (ESTILO APP) */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .card-item:active {
      transform: scale(0.98);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }

    .card-subtitle {
      font-size: 13px;
      color: #64748b;
    }

    .card-badge {
      text-align: right;
    }

    .card-badge-num {
      font-size: 22px;
    }

    /* TABLA EXCEL */
    .table-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    thead {
      background-color: #0d1b2a;
      color: #ffffff;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
      vertical-align: middle;
    }

    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      font-style: italic;
    }

    /* CONTROLES EDITABLES */
    .btn-accion-tarea {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .select-cultivo {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
    }

    .kilos-container {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .input-kilos {
      width: 75px;
      padding: 6px;
      border: 1.5px solid #0284c7;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .input-kilos:disabled {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-edit-kilos {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-guardar-kilos {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .fechas-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fecha-item {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-quitar-fecha {
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <div class="header">
    <h1 id="header-title">Inicio</h1>
    <button class="btn-principal" onclick="navegar('Inicio', 'Inicio')">
      <span>🏠</span> <span>Inicio</span>
    </button>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <div class="section-title" id="section-subtitle">Opciones Principales</div>
    
    <div id="contenedor-vista">
      <!-- Carga dinámica de la vista -->
    </div>
  </main>

  <script>
    const SHEET_ID = '1SbB2u_7yt4vhUJJagn5NkDTfMB0eY-o3XSATelXNwx4';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbycuDsb51R_YByTMRH0m_wzjiAP_3c1Iz_8k4BH28EPcx6TiFl68OgR2-GxE4o6N6RY/exec'; 

    let pestañaActual = 'Inicio';
    const memoriaFechas = {};

    const OPCIONES_CULTIVO = ['Barbecho', 'Frutales', 'Almendros'];
    const COLUMNAS_BOTON = ['laboreo', 'podado', 'tratamientos', 'trataminetos', 'recolección', 'poda'];

    function navegar(pestaña, tituloVisual) {
      pestañaActual = pestaña;
      document.getElementById('header-title').innerText = tituloVisual;
      
      const subTitulo = document.getElementById('section-subtitle');

      if (pestaña === 'Inicio') {
        subTitulo.innerText = "Opciones Principales";
        renderizarInicio();
      } else {
        subTitulo.innerText = "Registros de " + tituloVisual;
        cargarTablaExcel(pestaña);
      }
    }

    function renderizarInicio() {
      const contenedor = document.getElementById('contenedor-vista');
      contenedor.innerHTML = `
        <div class="cards-container">
          <div class="card-item" onclick="navegar('Identificación de Parcelas', 'Parcelas')">
            <div class="card-info">
              <div class="card-title">Parcelas</div>
              <div class="card-subtitle">Identificación y control de parcelas</div>
            </div>
            <div class="card-badge">
              <div class="card-badge-num">📍</div>
            </div>
          </div>

          <div class="card-item" onclick="navegar('Laboreos', 'Laboreos')">
            <div class="card-info">
              <div class="card-title">Laboreos</div>
              <div class="card-subtitle">Gestión de trabajos de laboreo</div>
            </div>
            <div class="card-badge">
              <div class="card-badge-num">🚜</div>
            </div>
          </div>

          <div class="card-item" onclick="navegar('Poda', 'Poda')">
            <div class="card-info">
              <div class="card-title">Poda</div>
              <div class="card-subtitle">Registros y control de poda</div>
            </div>
            <div class="card-badge">
              <div class="card-badge-num">✂️</div>
            </div>
          </div>

          <div class="card-item" onclick="navegar('Tratamientos', 'Tratamientos')">
            <div class="card-info">
              <div class="card-title">Tratamientos</div>
              <div class="card-subtitle">Control de tratamientos aplicados</div>
            </div>
            <div class="card-badge">
              <div class="card-badge-num">🧪</div>
            </div>
          </div>

          <div class="card-item" onclick="navegar('Recolección', 'Tareas')">
            <div class="card-info">
              <div class="card-title">Tareas / Recolección</div>
              <div class="card-subtitle">Control de tareas y kilos cosechados</div>
            </div>
            <div class="card-badge">
              <div class="card-badge-num">🧺</div>
            </div>
          </div>
        </div>
      `;
    }

    function cargarTablaExcel(pestaña) {
      const contenedor = document.getElementById('contenedor-vista');
      contenedor.innerHTML = `
        <div class="table-card">
          <div id="contenedor-tabla" class="table-responsive">
            <div class="loading">Cargando datos de Google Sheets...</div>
          </div>
        </div>
      `;
      obtenerDatosGoogleSheets(pestaña, false);
    }

    async function obtenerDatosGoogleSheets(pestaña, esEnSegundoPlano = true) {
      const contenedor = document.getElementById('contenedor-tabla');
      if (!contenedor) return;

      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(pestaña)}&t=${Date.now()}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Error al conectar con Google Sheets");
        
        const textData = await response.text();
        const filas = parseCSV(textData);

        if (filas.length === 0) {
          if (!esEnSegundoPlano) contenedor.innerHTML = '<div class="loading">La hoja seleccionada está vacía.</div>';
          return;
        }

        construirTablaHTML(filas, pestaña);

      } catch (error) {
        console.error("Error cargando datos:", error);
        if (!esEnSegundoPlano) {
          contenedor.innerHTML = `<div class="loading" style="color: #e63946;">Error al cargar los datos.</div>`;
        }
      }
    }

    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const matches = line.match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g);
        if (!matches) return line.split(',').map(cell => cell.replace(/^"|"$/g, '').trim());
        return matches.map(cell => cell.replace(/^"|"$/g, '').trim());
      }).filter(row => row.length > 0 && row.some(cell => cell !== ""));
    }

    function construirTablaHTML(data, pestaña) {
      const contenedor = document.getElementById('contenedor-tabla');
      if (!contenedor) return;

      const encabezadosOriginales = data[0];
      const totalColumnas = encabezadosOriginales.length;
      const filasData = data.slice(1);
      
      const esIdentificacion = pestaña.toLowerCase().trim().includes('identificación') || pestaña.toLowerCase().trim().includes('identificacion');
      const esSeccionLaboreos = pestaña.toLowerCase().trim() === 'laboreos';

      const encabezadosProcesados = encabezadosOriginales.map((enc, idx) => {
        if (esSeccionLaboreos && idx === 3) return 'Tipo de cultivo';
        return enc;
      });

      let html = '<table><thead><tr>';
      encabezadosProcesados.forEach(enc => { 
        html += `<th>${enc || '&nbsp;'}</th>`;
      });
      html += '</tr></thead><tbody>';

      filasData.forEach((fila, rowIndex) => {
        html += '<tr>';
        
        for (let colIndex = 0; colIndex < totalColumnas; colIndex++) {
          const header = encabezadosProcesados[colIndex] || '';
          const valor = fila[colIndex] !== undefined ? fila[colIndex] : '';
          const headerLower = header.toLowerCase().trim();

          const esTipoCultivo = esSeccionLaboreos && colIndex === 3;
          const esKilos = headerLower.includes('kilo') || headerLower.includes('quilo');
          const esColumnaTarea = COLUMNAS_BOTON.includes(headerLower);
          const esColumnaFecha = !esIdentificacion && (headerLower.includes('fecha') || colIndex === totalColumnas - 1);

          if (esIdentificacion) {
            html += `<td>${valor}</td>`;
          } 
          else if (esTipoCultivo) {
            html += `<td>
              <select class="select-cultivo" onchange="cambiarTipoCultivo(this, ${rowIndex}, ${colIndex})">
                <option value="" ${!valor ? 'selected' : ''}>-- Seleccionar --</option>`;
            
            OPCIONES_CULTIVO.forEach(opcion => {
              const selected = (valor.toLowerCase().trim() === opcion.toLowerCase().trim()) ? 'selected' : '';
              html += `<option value="${opcion}" ${selected}>${opcion}</option>`;
            });

            html += `</select></td>`;
          } 
          else if (esKilos) {
            const tieneValor = valor !== '' && valor !== null && valor !== undefined;
            const disabledAttr = tieneValor ? 'disabled' : '';
            const displayEdit = tieneValor ? 'inline-block' : 'none';

            html += `<td>
              <div class="kilos-container">
                <input type="number" 
                       id="input_kilos_${rowIndex}" 
                       class="input-kilos" 
                       placeholder="Cant..." 
                       value="${valor}" 
                       ${disabledAttr} 
                       min="0" 
                       step="any"
                       onblur="guardarKilosAuto(this, ${rowIndex}, ${colIndex})"
                       onkeydown="if(event.key==='Enter') { this.blur(); }" />
                
                <button id="btn_edit_${rowIndex}" 
                        class="btn-edit-kilos" 
                        title="Modificar" 
                        style="display: ${displayEdit};" 
                        onclick="habilitarEdicionKilos(${rowIndex})">✏️</button>

                <button id="btn_guardar_${rowIndex}" 
                        class="btn-guardar-kilos" 
                        style="display: none;" 
                        onclick="confirmarGuardarKilos(${rowIndex}, ${colIndex})">💾 Guardar</button>
              </div>
            </td>`;
          }
          else if (esColumnaTarea) {
            const textoBoton = valor ? valor : 'Marcar / Fecha';
            html += `<td>
              <button class="btn-accion-tarea" onclick="registrarFechaAccion(${rowIndex})">
                📅 ${textoBoton}
              </button>
            </td>`;
          } 
          else if (esColumnaFecha) {
            const key = `${pestaña}_fila_${rowIndex}`;
            memoriaFechas[key] = valor ? valor.split(' | ').map(s => s.trim()) : [];

            html += `<td id="celda_fecha_${rowIndex}">${renderizarFechasHTML(rowIndex, memoriaFechas[key])}</td>`;
          } 
          else {
            html += `<td>${valor}</td>`;
          }
        }

        html += '</tr>';
      });

      html += '</tbody></table>';
      contenedor.innerHTML = html;
    }

    function registrarFechaAccion(rowIndex) {
      const ahora = new Date();
      const fechaFormateada = ahora.toLocaleDateString('es-ES') + ' ' + ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      const key = `${pestañaActual}_fila_${rowIndex}`;

      if (!memoriaFechas[key]) memoriaFechas[key] = [];

      memoriaFechas[key].push(fechaFormateada);
      actualizarCeldaFecha(rowIndex, key);
      guardarEnGoogleSheets(rowIndex, memoriaFechas[key]);
    }

    function eliminarFechaIndex(rowIndex, fechaIndex) {
      const key = `${pestañaActual}_fila_${rowIndex}`;

      if (memoriaFechas[key]) {
        memoriaFechas[key].splice(fechaIndex, 1);
        actualizarCeldaFecha(rowIndex, key);
        guardarEnGoogleSheets(rowIndex, memoriaFechas[key]);
      }
    }

    function cambiarTipoCultivo(selectElement, rowIndex, colIndex) {
      guardarValorEspecificoGoogleSheets(rowIndex + 2, colIndex + 1, selectElement.value);
    }

    function guardarKilosAuto(input, rowIndex, colIndex) {
      if (input.disabled) return;
      const valor = input.value.trim();
      if (valor !== '') {
        input.disabled = true;
        const btnEdit = document.getElementById(`btn_edit_${rowIndex}`);
        const btnGuardar = document.getElementById(`btn_guardar_${rowIndex}`);
        if (btnEdit) btnEdit.style.display = 'inline-block';
        if (btnGuardar) btnGuardar.style.display = 'none';
        guardarValorEspecificoGoogleSheets(rowIndex + 2, colIndex + 1, valor);
      }
    }

    function habilitarEdicionKilos(rowIndex) {
      const input = document.getElementById(`input_kilos_${rowIndex}`);
      const btnEdit = document.getElementById(`btn_edit_${rowIndex}`);
      const btnGuardar = document.getElementById(`btn_guardar_${rowIndex}`);

      if (input) {
        input.disabled = false;
        input.focus();
        input.select();
        if (btnEdit) btnEdit.style.display = 'none';
        if (btnGuardar) btnGuardar.style.display = 'inline-block';
      }
    }

    function confirmarGuardarKilos(rowIndex, colIndex) {
      const input = document.getElementById(`input_kilos_${rowIndex}`);
      if (input) {
        input.disabled = true;
        const btnEdit = document.getElementById(`btn_edit_${rowIndex}`);
        const btnGuardar = document.getElementById(`btn_guardar_${rowIndex}`);
        if (btnEdit) btnEdit.style.display = 'inline-block';
        if (btnGuardar) btnGuardar.style.display = 'none';
        guardarValorEspecificoGoogleSheets(rowIndex + 2, colIndex + 1, input.value.trim());
      }
    }

    async function guardarEnGoogleSheets(rowIndex, listaFechas) {
      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sheet: pestañaActual, row: rowIndex + 2, fechas: listaFechas })
        });
      } catch (e) {
        console.error("Error al guardar:", e);
      }
    }

    async function guardarValorEspecificoGoogleSheets(rowInSheet, colInSheet, valor) {
      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sheet: pestañaActual, row: rowInSheet, column: colInSheet, valor: valor })
        });
      } catch (e) {
        console.error("Error al guardar:", e);
      }
    }

    function actualizarCeldaFecha(rowIndex, key) {
      const celdaFecha = document.getElementById(`celda_fecha_${rowIndex}`);
      if (celdaFecha) {
        celdaFecha.innerHTML = renderizarFechasHTML(rowIndex, memoriaFechas[key]);
      }
    }

    function renderizarFechasHTML(rowIndex, listaFechas) {
      if (!listaFechas || listaFechas.length === 0) return '';
      let html = '<div class="fechas-grid">';
      listaFechas.forEach((f, idx) => {
        html += `
          <div class="fecha-item">
            <span>📅 ${f}</span>
            <button class="btn-quitar-fecha" onclick="eliminarFechaIndex(${rowIndex}, ${idx})">−</button>
          </div>`;
      });
      html += '</div>';
      return html;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarInicio();
    });
  </script>
</body>
</html>
