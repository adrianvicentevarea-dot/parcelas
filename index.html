<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Agrícola - Parcelas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            margin: 8px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: 0.2s;
        }
        button.principal {
            background-color: #c9302c;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 20px;
        }
        button.menu-borrar {
            background-color: #d9534f;
        }
        button:hover {
            opacity: 0.85;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 25px 0;
        }
        .menu-seccion {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gestión Agrícola</h1>
        <p>Panel de control sincronizado con Google Sheets.</p>

        <!-- BOTÓN PRINCIPAL DE INICIO (Borra en TODAS las hojas a la vez) -->
        <div>
            <button class="principal" onclick="borrarTodoGlobal()">🗑️ Borrar Todo (Todas las hojas)</button>
        </div>

        <hr>

        <h3>Menús y Pestañas Individuales</h3>
        <p style="font-size: 14px; color: #666;">Selecciona la sección que deseas limpiar manteniendo seguras las parcelas:</p>
        
        <!-- Menú / Pestaña 1 -->
        <div class="menu-seccion">
            <h4>Menú: Laboreos</h4>
            <button class="menu-borrar" onclick="borrarPestanaActual('Laboreos')">🗑️ Borrar datos de Laboreos</button>
        </div>

        <!-- Menú / Pestaña 2 -->
        <div class="menu-seccion">
            <h4>Menú: Poda y Tratamientos</h4>
            <button class="menu-borrar" onclick="borrarPestanaActual('Poda')">🗑️ Borrar datos de Poda</button>
        </div>

        <!-- Menú / Pestaña 3 -->
        <div class="menu-seccion">
            <h4>Menú: Recolecta</h4>
            <button class="menu-borrar" onclick="borrarPestanaActual('Recolecta')">🗑️ Borrar datos de Recolecta</button>
        </div>
    </div>

    <!-- SCRIPT DE CONEXIÓN CON TU GOOGLE SHEETS -->
    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbycuDsb51R_YByTMRH0m_wzjiAP_3c1Iz_8k4BH28EPcx6TiFl68OgR2-GxE4o6N6RY/exec";

        // Función para el BOTÓN PRINCIPAL DE INICIO (Borra en TODAS las hojas)
        function borrarTodoGlobal() {
            if (!confirm("¿Estás seguro de que deseas borrar los datos de Fecha, Cultivo y Kilos en TODAS las hojas? Las parcelas no se borrarán.")) {
                return;
            }

            fetch(URL_WEB_APP, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "clearAllSheets" })
            })
            .then(response => response.json())
            .then(data => {
                alert("¡Se han borrado los datos correctamente en todas las hojas!");
                location.reload();
            })
            .catch(error => {
                console.error("Error al borrar todo:", error);
                alert("Orden enviada. Comprueba tu Google Sheets en unos segundos.");
                setTimeout(() => location.reload(), 2000);
            });
        }

        // Función para los BOTONES DE LOS MENÚS / PESTAÑAS INDIVIDUALES
        function borrarPestanaActual(nombreDeLaHoja) {
            if (!confirm(`¿Estás seguro de limpiar los datos de la hoja "${nombreDeLaHoja}"? Las parcelas se mantendrán intactas.`)) {
                return;
            }

            fetch(URL_WEB_APP, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "clearUserEnteredData", sheet: nombreDeLaHoja })
            })
            .then(response => response.json())
            .then(data => {
                alert(`¡Datos de la hoja "${nombreDeLaHoja}" borrados correctamente!`);
                location.reload();
            })
            .catch(error => {
                console.error("Error al borrar la pestaña:", error);
                setTimeout(() => location.reload(), 2000);
            });
        }
    </script>
</body>
</html>
