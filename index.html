<script>
    // Tu URL real de Google Apps Script
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbycuDsb51R_YByTMRH0m_wzjiAP_3c1Iz_8k4BH28EPcx6TiFl68OgR2-GxE4o6N6RY/exec';

    // Función para cargar los datos al iniciar la página
    async function loadDataFromExcel() {
        try {
            const response = await fetch(WEB_APP_URL + '?action=getData');
            const data = await response.json();
            
            console.log("Datos recibidos del Excel:", data);
            
            // Poblar cada tabla según la pestaña correspondiente de Google Sheets
            if (data["Identificación de Parcelas"] && data["Identificación de Parcelas"].length > 0) {
                populateTable('parcelas-table', data["Identificación de Parcelas"]);
            }
            if (data["Laboreos"] && data["Laboreos"].length > 0) {
                populateTable('laboreos-table', data["Laboreos"]);
            }
            if (data["Poda"] && data["Poda"].length > 0) {
                populateTable('poda-table', data["Poda"]);
            }
            if (data["Tratamientos"] && data["Tratamientos"].length > 0) {
                populateTable('tratamientos-table', data["Tratamientos"]);
            }
            if (data["Recolección"] && data["Recolección"].length > 0) {
                populateTable('recoleccion-table', data["Recolección"]);
            }
            
        } catch (error) {
            console.error("Error al conectar con el Excel:", error);
        }
    }

    // Función auxiliar para rellenar las filas dinámicamente manteniendo la estructura
    function populateTable(tableId, rowsData) {
        const table = document.getElementById(tableId);
        if (!table) return;
        const tbody = table.getElementsByTagName('tbody')[0];
        tbody.innerHTML = ''; // Limpiar filas de ejemplo

        rowsData.forEach(rowData => {
            const tr = document.createElement('tr');
            
            let htmlContent = `
                <td>
                    <div class="action-cell">
                        <button class="btn-icon edit" title="Editar">✏️</button>
                        <button class="btn-icon delete" onclick="deleteRow(this)" title="Eliminar">🗑️</button>
                    </div>
                </td>
            `;

            rowData.forEach(cellValue => {
                htmlContent += `<td><input type="text" value="${cellValue !== undefined && cellValue !== null ? cellValue : ''}"></td>`;
            });

            tr.innerHTML = htmlContent;
            tbody.appendChild(tr);
        });
    }

    // Ejecutar la carga al cargar la ventana
    window.onload = function() {
        loadDataFromExcel();
    };

    function switchView(viewName) {
        const sections = document.querySelectorAll('.view-section');
        sections.forEach(sec => sec.classList.remove('active'));
        
        const target = document.getElementById('view-' + viewName);
        if (target) {
            target.classList.add('active');
            window.scrollTo(0, 0);
        }
    }

    function addRow(tableId) {
        const table = document.getElementById(tableId);
        const tbody = table.getElementsByTagName('tbody')[0];
        const firstRow = tbody.rows[0];
        
        if (!firstRow) return;

        const newRow = firstRow.cloneNode(true);
        const inputs = newRow.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.value = '';
        });

        const deleteBtn = newRow.querySelector('.btn-icon.delete');
        if(deleteBtn) {
            deleteBtn.setAttribute('onclick', 'deleteRow(this)');
        }

        tbody.appendChild(newRow);
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        const tbody = row.closest('tbody');
        if (tbody.rows.length > 1) {
            row.remove();
        } else {
            alert("Debe mantenerse al menos una fila en la tabla.");
        }
    }

    function confirmReset() {
        if(confirm("¿Estás seguro de que deseas borrar los datos del Excel?")) {
            alert("Datos restablecidos correctamente.");
        }
    }
</script>
