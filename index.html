<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión Agrícola</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navegación por pestañas -->
  <nav class="tabs-nav">
    <button class="tab-button active" onclick="openTab('gestion')">Gestión de Campo</button>
    <button class="tab-button" onclick="openTab('resumen')">Resumen</button>
  </nav>

  <!-- Pestaña 1: Menús Principales -->
  <div id="gestion" class="tab-content active">
    <h2>Menú de Operaciones</h2>
    
    <div class="menu-grid">
      <!-- Menú Laboreos -->
      <div class="card">
        <h3>Laboreos</h3>
        <button onclick="ejecutarAccion('Laboreos')">Ver / Añadir Registro</button>
      </div>

      <!-- Menú Poda -->
      <div class="card">
        <h3>Poda</h3>
        <button onclick="ejecutarAccion('Poda')">Ver / Añadir Registro</button>
      </div>

      <!-- Menú Tratamientos -->
      <div class="card">
        <h3>Tratamientos</h3>
        <button onclick="ejecutarAccion('Tratamientos')">Ver / Añadir Registro</button>
      </div>

      <!-- Menú Recolección -->
      <div class="card">
        <h3>Recolección</h3>
        <button onclick="ejecutarAccion('Recolección')">Ver / Añadir Registro</button>
      </div>
    </div>
  </div>

  <!-- Pestaña 2: Resumen -->
  <div id="resumen" class="tab-content">
    <h2>Resumen General</h2>
    <p>Aquí se mostrarán los datos cargados desde Google Sheets.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
